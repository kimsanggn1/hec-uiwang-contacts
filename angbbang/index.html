<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앙빵계 비상연락처</title>
<meta name="description" content="앙빵 계모임 9인 전용 비상연락처">
<meta name="theme-color" content="#FFF7EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="앙빵계">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --ink:#2A211C;
    --ink-2:#4B3D34;
    --muted:#8A7B70;
    --line:#EFE3D6;
    --bg:#FFF9F2;
    --soft:#FDF2E6;
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    font-size:17px;
    line-height:1.45;
    word-break:keep-all;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;color:inherit;}
  [hidden]{display:none !important;}

  /* ================= 잠금 화면 ================= */
  #lockScreen{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(180deg,#FFF9F2 0%,#FFF4E6 100%);
    display:flex; align-items:center; justify-content:center;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .lock-inner{width:100%; max-width:352px; text-align:center;}
  .lock-hero{
    width:100%;margin:0 auto 14px;
    border-radius:20px;overflow:hidden;background:#fff;
    border:1px solid var(--line);
    box-shadow:0 8px 20px -14px rgba(120,80,40,.55);
  }
  .lock-hero img{width:100%;height:auto;display:block;}
  #lockScreen h1{font-size:24px;font-weight:900;letter-spacing:-.6px;margin:0 0 4px;}
  .lock-sub{font-size:13.5px;color:var(--muted);margin:0 0 20px;font-weight:600;letter-spacing:-.2px;}
  .dots{display:flex;gap:16px;justify-content:center;margin-bottom:8px;}
  .dots i{
    width:15px;height:15px;border-radius:50%;
    border:2px solid #E2CDB6; background:#fff;
    transition:background .12s, border-color .12s, transform .12s;
  }
  .dots i.on{background:#B9563B;border-color:#B9563B;transform:scale(1.08);}
  .dots.busy i{border-color:#C9A98A;animation:pulse .7s ease-in-out infinite;}
  .dots.busy i:nth-child(2){animation-delay:.1s;}
  .dots.busy i:nth-child(3){animation-delay:.2s;}
  .dots.busy i:nth-child(4){animation-delay:.3s;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .dots.shake{animation:shake .42s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-9px);}
    30%{transform:translateX(8px);}
    45%{transform:translateX(-7px);}
    60%{transform:translateX(6px);}
    75%{transform:translateX(-4px);}
    90%{transform:translateX(2px);}
  }
  .lock-msg{font-size:13.5px;color:var(--muted);margin:0 0 14px;min-height:20px;font-weight:600;}
  .lock-msg.err{color:#C0392B;font-weight:800;}
  .lock-msg.warn{color:#A96410;font-weight:800;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .key{
    height:60px;border:1px solid var(--line);border-radius:16px;
    background:#fff;font-size:24px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;
    transition:background .1s, transform .06s;
    font-variant-numeric:tabular-nums;
    box-shadow:0 1px 0 rgba(120,80,40,.05);
  }
  .key:active{background:#FBEFE1;transform:scale(.98);}
  .key.ghost{font-size:16px;font-weight:700;color:var(--muted);border-color:transparent;background:transparent;box-shadow:none;}
  .key.ghost:active{background:#F7EBDD;}
  .lock-foot{margin:14px 0 0;font-size:11.5px;color:#B3A496;line-height:1.5;}

  /* ================= 앱 본체 ================= */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:660px;margin:0 auto;padding:0 14px calc(14px + env(safe-area-inset-bottom));}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(255,249,242,.95);
    backdrop-filter:saturate(160%) blur(8px);
    -webkit-backdrop-filter:saturate(160%) blur(8px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .topbar-in{
    max-width:660px;margin:0 auto;padding:7px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .tb-title{min-width:0;}
  .tb-title h1{font-size:18.5px;font-weight:900;letter-spacing:-.5px;margin:0;line-height:1.2;}
  .tb-title p{margin:1px 0 0;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:-.2px;}
  .tb-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .tbtn{
    height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    white-space:nowrap;
  }
  .tbtn:active{background:var(--soft);}
  .tbtn.on{background:#B9563B;border-color:#B9563B;color:#fff;}
  .tbtn.lock{width:38px;padding:0;font-size:15px;}

  .group-figure{
    margin:14px 0 0;border-radius:18px;overflow:hidden;
    background:#fff;border:1px solid var(--line);
    box-shadow:0 6px 16px -14px rgba(120,80,40,.5);
  }
  .group-figure img{width:100%;height:auto;display:block;}
  .group-figure figcaption{
    font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;
    padding:7px 0 8px;letter-spacing:-.2px;
  }

  /* 카드 */
  .list{display:flex;flex-direction:column;gap:6px;padding-top:9px;}
  .card{
    position:relative;
    background:#fff;border:1px solid var(--line);border-radius:17px;
    padding:5px 10px 5px 12px;
    box-shadow:0 1px 2px rgba(120,80,40,.05);
    display:grid;grid-template-columns:54px 1fr;column-gap:11px;
  }
  .card::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;
    background:var(--accent,#B9563B);
    border-radius:0 4px 4px 0;
  }
  .avatar{
    position:relative;grid-row:1;flex:0 0 auto;
    width:54px;height:54px;border-radius:16px;
    background:var(--tint,#FBEFE1);color:var(--accent,#B9563B);
    display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:900;letter-spacing:-1px;line-height:1;
    overflow:hidden;border:1px solid rgba(120,80,40,.08);
    padding:0;cursor:default;align-self:center;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar .cam{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(42,33,28,.42);color:#fff;font-size:18px;line-height:1;
  }
  body.editing .avatar{cursor:pointer;}
  body.editing .avatar .cam{display:flex;}

  .who{grid-column:2;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .name-row{display:flex;align-items:center;gap:6px;min-width:0;}
  .badge{
    flex:0 0 auto;
    font-size:11px;font-weight:900;letter-spacing:-.3px;
    color:#fff;background:var(--accent,#B9563B);
    padding:2.5px 8px;border-radius:999px;line-height:1.25;
    max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-name{
    font-size:19.5px;font-weight:900;letter-spacing:-.7px;margin:0;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .num{
    display:block;margin-top:0;
    font-size:19.5px;font-weight:900;letter-spacing:.2px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);text-decoration:none;line-height:1.25;
    white-space:nowrap;
  }
  .num.miss{font-size:14px;font-weight:700;color:#B3A496;letter-spacing:-.2px;}

  .actions{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:4px;}
  .abtn{
    height:31px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:14px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:4px;
    text-decoration:none;color:var(--ink-2);
    white-space:nowrap;
  }
  .abtn:active{transform:scale(.985);background:var(--soft);}
  .abtn.call{background:var(--accent,#B9563B);border-color:var(--accent,#B9563B);color:#fff;}
  .abtn.call:active{background:var(--accent,#B9563B);opacity:.86;}
  .abtn[aria-disabled="true"]{opacity:.4;pointer-events:none;}

  .card-edit{grid-column:1 / -1;display:none;gap:7px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);}
  body.editing .card-edit{display:grid;grid-template-columns:1fr 1fr;}
  .ebtn{
    min-height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;
    font-size:14px;font-weight:800;cursor:pointer;
  }
  .ebtn.del{color:#C0392B;border-color:#F2CCC4;}
  .empty{
    text-align:center;color:var(--muted);font-size:15px;
    padding:40px 10px;border:1px dashed var(--line);border-radius:var(--r);
  }

  /* 편집 패널 */
  .panel{
    margin-top:14px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--soft);padding:13px;
    display:flex;flex-direction:column;gap:9px;
  }
  .panel h2{font-size:13.5px;font-weight:900;color:var(--ink-2);margin:2px 2px 0;letter-spacing:-.3px;}
  .panel-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .wbtn{
    min-height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;
    font-size:15px;font-weight:800;cursor:pointer;padding:0 12px;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .wbtn.primary{background:#B9563B;border-color:#B9563B;color:#fff;}
  .wbtn:active{opacity:.85;}
  .pinrow{display:flex;gap:9px;align-items:stretch;}
  .pinrow input{
    flex:1 1 auto;min-width:0;height:48px;border:1px solid var(--line);border-radius:14px;
    font-size:19px;font-weight:800;letter-spacing:6px;text-align:center;
    background:#fff;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 10px;
  }
  .pinrow input::placeholder{letter-spacing:1px;font-size:13.5px;font-weight:700;color:#B3A496;}
  .pinrow .wbtn{flex:0 0 auto;padding:0 18px;}
  .hint{font-size:12.5px;color:var(--muted);margin:0 2px;line-height:1.45;}
  .foot{
    margin-top:20px;text-align:center;font-size:12px;color:#B3A496;line-height:1.6;
  }

  /* 편집 시트 */
  .sheet{
    position:fixed;inset:0;z-index:60;
    background:rgba(42,33,28,.42);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet-card{
    width:100%;max-width:660px;background:#fff;
    border-radius:24px 24px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(14px);opacity:.6;}to{transform:none;opacity:1;}}
  .sheet-card h2{font-size:19px;font-weight:900;letter-spacing:-.5px;margin:0 0 13px;}
  .photorow{display:flex;align-items:center;gap:12px;margin-bottom:13px;}
  .photoprev{
    flex:0 0 auto;width:62px;height:62px;border-radius:18px;overflow:hidden;
    background:#FBEFE1;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#B3A496;
  }
  .photoprev img{width:100%;height:100%;object-fit:cover;display:block;}
  .photobtns{display:flex;gap:8px;flex:1 1 auto;min-width:0;}
  .photobtns .wbtn{flex:1 1 0;min-height:46px;font-size:14px;padding:0 8px;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin-bottom:5px;}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:14px;
    font-size:17px;background:#fff;color:var(--ink);
    font-family:inherit;height:50px;padding:0 14px;
  }
  .field input::placeholder{color:#C6B7A8;font-size:15.5px;}
  .field input:focus{outline:none;border-color:#B9563B;box-shadow:0 0 0 3px rgba(185,86,59,.12);}
  .sheet-actions{
    display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:8px;
    position:sticky;bottom:0;background:#fff;padding:10px 0 4px;
    box-shadow:0 -10px 14px -12px rgba(42,33,28,.2);
  }

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:rgba(42,33,28,.95);color:#fff;
    font-size:14.5px;font-weight:700;border-radius:999px;
    padding:11px 20px;z-index:200;opacity:0;pointer-events:none;
    transition:opacity .18s, transform .18s;white-space:nowrap;max-width:92vw;
    overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (min-width:700px){
    .list{gap:9px;}
    .card{padding:10px 14px 10px 16px;grid-template-columns:64px 1fr;column-gap:13px;}
    .avatar{width:64px;height:64px;border-radius:19px;}
    .card-name{font-size:21px;}
    .num{font-size:21px;}
    .abtn{height:36px;}
    .actions{margin-top:6px;}
  }
  @media (max-width:359px){
    .card-name{font-size:18px;}
    .num{font-size:18px;}
    .abtn{font-size:13px;gap:3px;}
    .badge{font-size:10.5px;padding:2px 7px;}
    .wrap{padding-left:11px;padding-right:11px;}
    .card{grid-template-columns:50px 1fr;column-gap:9px;padding:5px 9px 5px 11px;}
    .avatar{width:50px;height:50px;border-radius:15px;}
    .actions{margin-top:3px;}
    .abtn{height:29px;}
  }
  /* 짧은 화면: 9명이 한 화면에 들어오도록 한 단계 더 압축 */
  @media (max-height:780px){
    .list{gap:5px;padding-top:7px;}
    .card{padding:4px 9px 4px 11px;}
    .avatar{width:50px;height:50px;border-radius:15px;}
    .card{grid-template-columns:50px 1fr;column-gap:9px;}
    .card-name{font-size:18.5px;}
    .num{font-size:18.5px;}
    .abtn{height:28px;font-size:13px;}
    .actions{margin-top:3px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<!-- ================= 잠금 ================= -->
<div class="lock" id="lockScreen">
  <div class="lock-inner">
    <div class="lock-hero"><img src="./team_banner.jpg" alt="앙빵계 9인 웹툰 일러스트"></div>
    <h1>앙빵계 비상연락처</h1>
    <p class="lock-sub">앙빵 계모임 · 9인 전용</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <p class="lock-msg" id="lockMsg">4자리 PIN을 입력하세요</p>
    <div class="keypad" id="keypad">
      <button class="key" data-key="1" type="button">1</button>
      <button class="key" data-key="2" type="button">2</button>
      <button class="key" data-key="3" type="button">3</button>
      <button class="key" data-key="4" type="button">4</button>
      <button class="key" data-key="5" type="button">5</button>
      <button class="key" data-key="6" type="button">6</button>
      <button class="key" data-key="7" type="button">7</button>
      <button class="key" data-key="8" type="button">8</button>
      <button class="key" data-key="9" type="button">9</button>
      <button class="key ghost" data-key="clear" type="button">지우기</button>
      <button class="key" data-key="0" type="button">0</button>
      <button class="key ghost" data-key="back" type="button">⌫</button>
    </div>
    <p class="lock-foot">연락처는 이 화면의 PIN으로만 열립니다.<br>저장소에는 AES-256 암호문으로만 남습니다.</p>
  </div>
</div>

<!-- ================= 앱 ================= -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <div class="tb-title">
        <h1>앙빵계 비상연락처</h1>
        <p>앙빵 계모임 · 9인 전용</p>
      </div>
      <div class="tb-actions">
        <button class="tbtn" id="editToggle" type="button">편집</button>
        <button class="tbtn lock" id="lockBtn" type="button" title="잠금" aria-label="잠금">🔒</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="list" id="list"></div>
    <figure class="group-figure">
      <img src="./team_banner.jpg" alt="앙빵계 9인 웹툰 일러스트">
      <figcaption>앙빵 계모임 9인</figcaption>
    </figure>

    <section class="panel" id="editPanel" hidden>
      <h2>연락처 관리</h2>
      <button class="wbtn primary" id="addBtn" type="button">＋ 연락처 추가</button>
      <div class="panel-row">
        <button class="wbtn" id="exportBtn" type="button">⬇ 암호화 백업</button>
        <button class="wbtn" id="importBtn" type="button">⬆ 백업 불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <h2 style="margin-top:6px;">PIN 변경</h2>
      <div class="pinrow">
        <input id="pinInput" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="새 PIN 4자리">
        <button class="wbtn" id="pinSave" type="button">저장</button>
      </div>
      <p class="hint">처음 PIN은 1234입니다. 바꾼 PIN과 고친 내용은 이 기기에만 새 PIN으로 다시 암호화해 저장됩니다.</p>
      <button class="wbtn" id="resetBtn" type="button">↺ 기본 연락처로 되돌리기</button>
    </section>

    <p class="foot">PIN으로 잠긴 연락처 · 오프라인에서도 열립니다<br>앙빵 계모임 9인 전용</p>
  </div>
</div>

<!-- ================= 편집 시트 ================= -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <h2 id="sheetTitle">연락처 수정</h2>
    <form id="editForm" autocomplete="off">
      <div class="photorow">
        <div class="photoprev" id="photoPrev">사진</div>
        <div class="photobtns">
          <button class="wbtn" id="photoPick" type="button">📷 사진 선택</button>
          <button class="wbtn" id="photoClear" type="button">삭제</button>
        </div>
      </div>
      <input type="file" id="photoFile" accept="image/*" hidden>
      <div class="field">
        <label for="f-name">이름</label>
        <input id="f-name" name="name" type="text" placeholder="예) 성명" required>
      </div>
      <div class="field">
        <label for="f-nick">별명 (뱃지)</label>
        <input id="f-nick" name="nick" type="text" placeholder="예) 별명">
      </div>
      <div class="field">
        <label for="f-phone">휴대전화</label>
        <input id="f-phone" name="phone" type="tel" inputmode="tel" placeholder="010-0000-0000">
      </div>
      <div class="sheet-actions">
        <button class="wbtn" id="cancelBtn" type="button">취소</button>
        <button class="wbtn primary" type="submit">저장</button>
      </div>
    </form>
  </div>
</div>

<input type="file" id="avatarFile" accept="image/*" hidden>

    var s = "", CH = 0x8000;
    for(var i=0;i<u.length;i+=CH){
      s += String.fromCharCode.apply(null, u.subarray(i, i+CH));
    }
    return btoa(s);
  }
  function hasCrypto(){ return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey); }

  function deriveKey(pin, salt, iter){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function(bk){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"},
          bk, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
      });
  }
  function decryptPayload(p, pin){
    if(!hasCrypto()) return Promise.reject(new Error("nocrypto"));
    var iter = p.iter || ITER_FALLBACK;
    return deriveKey(pin, b64ToBytes(p.salt), iter).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(p.iv)}, key, b64ToBytes(p.cipher));
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }
  function encryptPayload(obj, pin){
    if(!hasCrypto()) return Promise.reject(new Error("nocrypto"));
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pin, salt, ITER_FALLBACK).then(function(key){
      return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key,
        new TextEncoder().encode(JSON.stringify(obj)));
    }).then(function(buf){
      return {
        v:2, alg:"AES-256-GCM", kdf:"PBKDF2-SHA256", iter:ITER_FALLBACK,
        salt:bytesToB64(salt), iv:bytesToB64(iv), cipher:bytesToB64(new Uint8Array(buf))
      };
    });
  }

      name: c && c.name ? String(c.name) : "",
      nick: c && c.nick ? String(c.nick) : "",

      color: c && c.color ? String(c.color) : "",

  function readLocal(){

      if(!raw) return null;
      var p = JSON.parse(raw);
      if(p && p.cipher && p.salt && p.iv) return p;
    }catch(e){}
    return null;
  }

  /* ---------- 사진 ---------- */
  function resizePhoto(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        try{
          var S = 256;
          var cv = document.createElement("canvas");
          cv.width = S; cv.height = S;
          var g = cv.getContext("2d");
          g.fillStyle = "#ffffff";
          g.fillRect(0, 0, S, S);
          var scale = Math.max(S / img.width, S / img.height);
          var w = img.width * scale, h = img.height * scale;
          g.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
          cb(cv.toDataURL("image/jpeg", 0.84));
        }catch(e){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = String(reader.result);
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function copyText(text){
    var done = function(){ toast(text + " 복사됨"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    }else{
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly","");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    if(ok) done(); else toast("복사가 차단되었습니다. 길게 눌러 복사하세요");
  }

    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = String(reader.result);
      var parsed;
      try{ parsed = JSON.parse(text); }catch(err){ toast("JSON 형식이 올바르지 않습니다"); e.target.value = ""; return; }

      function done(arr){
        if(!arr || !arr.length){ toast("불러올 연락처가 없습니다"); e.target.value = ""; return; }
        if(!confirm("현재 연락처 " + contacts.length + "개를 불러온 " + arr.length + "개로 바꿀까요?")) { e.target.value = ""; return; }

        persist().then(function(){ render(); toast("불러왔습니다 (" + contacts.length + "명)"); });
        e.target.value = "";

      if(parsed && parsed.cipher && parsed.salt && parsed.iv){
        decryptPayload(parsed, pinNow).then(function(data){

        }).catch(function(){ toast("이 백업은 현재 PIN으로 열 수 없습니다"); e.target.value = ""; });

  function tryUnlock(pin){
    var local = readLocal();
    var sources = local ? [local, BASE] : [BASE];
    var i = 0;
    function next(){
      if(i >= sources.length) return Promise.resolve(false);
      var src = sources[i++];
      return decryptPayload(src, pin).then(function(data){
        if(data && Array.isArray(data.contacts)){
          contacts = data.contacts.map(normalize);
          pinNow = pin;
          saveSession();
          return true;
        }
        return next();
      }).catch(function(){ return next(); });
    }
    return next();
  }

  function pressKey(k){
    if(busy) return;
    if(k === "clear"){ clearBuffer(); return; }
    if(k === "back"){ buffer = buffer.slice(0, -1); paintDots(); return; }
    if(!/^\d$/.test(k)) return;
    if(buffer.length >= 4) return;
    buffer += k;
    paintDots();
    if(buffer.length < 4) return;

    if(!hasCrypto()){
      setMsg("HTTPS 주소에서만 열 수 있습니다. 주소를 확인해 주세요.", "warn");
      clearBuffer();
      return;
    }
    busy = true;
    dots.classList.add("busy");
    setMsg("확인 중…");
    tryUnlock(buffer).then(function(ok){
      busy = false;
      dots.classList.remove("busy");
      if(ok){ clearBuffer(); showApp(); }
      else { fail(); }
    }).catch(function(){
      busy = false;
      dots.classList.remove("busy");
      fail();
    });
  }
