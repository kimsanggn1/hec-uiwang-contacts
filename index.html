<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단독부지 비상연락망</title>
<meta name="description" content="현대엔지니어링 의왕연구소 현대차 단독부지 5인 팀 전용 비상연락망">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="비상연락망">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --ink:#111827;
    --ink-2:#374151;
    --muted:#6b7280;
    --line:#e5e7eb;
    --bg:#ffffff;
    --soft:#f8fafc;
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    font-size:17px;
    line-height:1.5;
    word-break:keep-all;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;color:inherit;}
  [hidden]{display:none !important;}

  /* ================= 잠금 화면 ================= */
  #lockScreen{
    position:fixed; inset:0; z-index:100;
    background:#ffffff;
    display:flex; align-items:center; justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .lock-inner{width:100%; max-width:360px; text-align:center;}
  .lock-hero{
    width:100%;max-width:322px;margin:0 auto 18px;
    border-radius:20px;overflow:hidden;background:#f4f8fd;
    border:1px solid #eaeff7;
  }
  .lock-hero img{width:100%;height:auto;display:block;}
  #lockScreen h1{font-size:23px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px;}
  .lock-sub{font-size:14px;color:var(--muted);margin:0 0 26px;}
  .dots{display:flex;gap:18px;justify-content:center;margin-bottom:10px;}
  .dots i{
    width:16px;height:16px;border-radius:50%;
    border:2px solid #cbd5e1; background:#fff;
    transition:background .12s, border-color .12s, transform .12s;
  }
  .dots i.on{background:#1e293b;border-color:#1e293b;transform:scale(1.06);}
  .dots.busy i{border-color:#94a3b8;animation:pulse .7s ease-in-out infinite;}
  .dots.busy i:nth-child(2){animation-delay:.1s;}
  .dots.busy i:nth-child(3){animation-delay:.2s;}
  .dots.busy i:nth-child(4){animation-delay:.3s;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .dots.shake{animation:shake .42s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-9px);}
    30%{transform:translateX(8px);}
    45%{transform:translateX(-7px);}
    60%{transform:translateX(6px);}
    75%{transform:translateX(-4px);}
    90%{transform:translateX(2px);}
  }
  .lock-msg{font-size:14px;color:var(--muted);margin:0 0 18px;min-height:21px;}
  .lock-msg.err{color:#c0392b;font-weight:700;}
  .lock-msg.warn{color:#b45309;font-weight:700;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .key{
    height:66px;border:1px solid var(--line);border-radius:16px;
    background:#fff;font-size:26px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;
    transition:background .1s, transform .06s;
    font-variant-numeric:tabular-nums;
  }
  .key:active{background:#eef2f7;transform:scale(.98);}
  .key.ghost{font-size:18px;font-weight:600;color:var(--muted);border-color:transparent;background:transparent;}
  .key.ghost:active{background:var(--soft);}
  .lock-foot{margin:18px 0 0;font-size:11.5px;color:#9aa3af;line-height:1.55;}

  /* ================= 앱 본체 ================= */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:640px;margin:0 auto;padding:0 18px calc(14px + env(safe-area-inset-bottom));}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.94);
    backdrop-filter:saturate(160%) blur(8px);
    -webkit-backdrop-filter:saturate(160%) blur(8px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .topbar-in{
    max-width:640px;margin:0 auto;padding:6px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .tb-title h1{font-size:18px;font-weight:800;letter-spacing:-.4px;margin:0;line-height:1.25;}
  .tb-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .tbtn{
    height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    white-space:nowrap;
  }
  .tbtn:active{background:var(--soft);}
  .tbtn.on{background:#1e293b;border-color:#1e293b;color:#fff;}
  .tbtn.lock{width:38px;padding:0;font-size:15px;}

  .hero{
    margin-top:8px;height:88px;border-radius:18px;overflow:hidden;
    background:#f4f8fd;border:1px solid #eaeff7;
  }
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}

  /* 카드 */
  .list{display:flex;flex-direction:column;gap:8px;padding-top:8px;}
  .card{
    position:relative;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:8px 13px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--accent,#1e293b);
    border-radius:var(--r) 0 0 var(--r);
  }
  .card-head{display:flex;align-items:center;gap:10px;}
  .avatar{
    position:relative;flex:0 0 auto;
    width:42px;height:42px;border-radius:15px;
    background:var(--tint,#eef2f7);color:var(--accent,#1e293b);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;letter-spacing:-.5px;line-height:1;
    overflow:hidden;border:1px solid rgba(17,24,39,.06);
    padding:0;cursor:default;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar .cam{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(17,24,39,.42);color:#fff;font-size:18px;line-height:1;
  }
  body.editing .avatar{cursor:pointer;}
  body.editing .avatar .cam{display:flex;}
  .who{flex:1 1 auto;min-width:0;}
  .name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .badge{
    flex:0 0 auto;
    font-size:11.5px;font-weight:800;letter-spacing:-.2px;
    color:#fff;background:var(--accent,#1e293b);
    padding:3px 8px;border-radius:999px;line-height:1.25;
  }
  .card-name{
    font-size:20.5px;font-weight:800;letter-spacing:-.6px;margin:0;line-height:1.15;
  }
  .card-title{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:-.2px;}
  .license{
    font-size:11px;color:var(--muted);margin:1px 0 0;line-height:1.25;
  }
  .license b{color:var(--ink-2);font-weight:700;}

  .numrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:4px;
  }
  .num{
    font-size:21px;font-weight:800;letter-spacing:.1px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);text-decoration:none;line-height:1.2;
  }
  .num.miss{font-size:15px;font-weight:700;color:#9aa3af;letter-spacing:-.2px;}
  .more-btn{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;
    border-radius:999px;height:24px;padding:0 9px;
    font-size:11px;font-weight:700;color:var(--ink-2);cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .more-btn:active{background:var(--soft);}
  .more-btn.open{background:#f1f5f9;}

  .more-body{
    margin-top:8px;padding:10px 12px;border-radius:14px;
    background:var(--soft);border:1px solid #eef2f7;
  }
  .more-body .row-label{
    font-size:12px;font-weight:800;color:#94a3b8;letter-spacing:-.1px;
    margin:0 0 4px;
  }
  .more-body .duty-text{font-size:13.5px;color:var(--ink-2);margin:0 0 9px;line-height:1.45;}
  .more-body ul{margin:0;padding-left:15px;}
  .more-body li{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0 0 1px;}
  .more-body .office{
    font-size:13px;color:var(--muted);margin:9px 0 0;
    font-variant-numeric:tabular-nums;
  }
  .more-body .office b{font-weight:700;color:var(--ink-2);}

  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px;}
  .abtn{
    min-height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;
    font-size:14.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;
    text-decoration:none;color:var(--ink);
    white-space:nowrap;
  }
  .abtn:active{transform:scale(.985);background:var(--soft);}
  .abtn.call{background:var(--accent,#1e293b);border-color:var(--accent,#1e293b);color:#fff;}
  .abtn.call:active{background:var(--accent,#1e293b);opacity:.86;}
  .abtn[aria-disabled="true"]{opacity:.4;pointer-events:none;}

  .card-edit{display:none;gap:8px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);}
  body.editing .card-edit{display:grid;grid-template-columns:1fr 1fr;}
  .ebtn{
    min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .ebtn.del{color:#c0392b;border-color:#f3c7c1;}
  .empty{
    text-align:center;color:var(--muted);font-size:15px;
    padding:44px 10px;border:1px dashed var(--line);border-radius:var(--r);
  }

  /* 편집 패널 */
  .panel{
    margin-top:16px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--soft);padding:14px;
    display:flex;flex-direction:column;gap:9px;
  }
  .panel h2{font-size:14px;font-weight:800;color:var(--ink-2);margin:2px 2px 0;letter-spacing:-.2px;}
  .panel-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .wbtn{
    min-height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;
    font-size:15.5px;font-weight:700;cursor:pointer;padding:0 12px;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .wbtn.primary{background:#1e293b;border-color:#1e293b;color:#fff;}
  .wbtn:active{opacity:.85;}
  .pinrow{display:flex;gap:9px;align-items:stretch;}
  .pinrow input{
    flex:1 1 auto;min-width:0;height:50px;border:1px solid var(--line);border-radius:14px;
    font-size:19px;font-weight:700;letter-spacing:6px;text-align:center;
    background:#fff;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 10px;
  }
  .pinrow input::placeholder{letter-spacing:2px;font-size:14px;font-weight:600;color:#9aa3af;}
  .pinrow .wbtn{flex:0 0 auto;padding:0 18px;}
  .hint{font-size:12.5px;color:var(--muted);margin:0 2px;line-height:1.4;}
  .foot{
    margin-top:22px;text-align:center;font-size:12.5px;color:#9aa3af;line-height:1.6;
  }

  /* 편집 시트 */
  .sheet{
    position:fixed;inset:0;z-index:60;
    background:rgba(17,24,39,.42);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet-card{
    width:100%;max-width:640px;background:#fff;
    border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(14px);opacity:.6;}to{transform:none;opacity:1;}}
  .sheet-card h2{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0 0 14px;}
  .photorow{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .photoprev{
    flex:0 0 auto;width:62px;height:62px;border-radius:24px;overflow:hidden;
    background:#eef2f7;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:#94a3b8;
  }
  .photoprev img{width:100%;height:100%;object-fit:cover;display:block;}
  .photobtns{display:flex;gap:8px;flex:1 1 auto;min-width:0;}
  .photobtns .wbtn{flex:1 1 0;min-height:46px;font-size:14.5px;padding:0 8px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:14px;
    font-size:17px;padding:12px 14px;background:#fff;color:var(--ink);
    font-family:inherit;
  }
  .field input{height:52px;padding:0 14px;}
  .field textarea{min-height:104px;line-height:1.5;resize:vertical;}
  .field input::placeholder, .field textarea::placeholder{color:#b6bdc7;font-size:15.5px;}
  .field input:focus, .field textarea:focus{outline:none;border-color:#1e293b;box-shadow:0 0 0 3px rgba(30,41,59,.08);}
  .sheet-actions{
    display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:8px;
    position:sticky;bottom:0;background:#fff;padding:10px 0 4px;
    box-shadow:0 -10px 14px -12px rgba(17,24,39,.18);
  }

  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:rgba(17,24,39,.94);color:#fff;
    font-size:15px;font-weight:600;border-radius:999px;
    padding:11px 20px;z-index:200;opacity:0;pointer-events:none;
    transition:opacity .18s, transform .18s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (min-width:720px){
    .hero{height:150px;}
    .list{gap:10px;}
    .card{padding:11px 16px;}
    .card-name{font-size:22px;}
    .num{font-size:23px;}
  }
  @media (max-width:359px){
    .card-name{font-size:20px;}
    .num{font-size:20px;}
    .abtn{font-size:13.5px;gap:3px;}
    .badge{font-size:11px;padding:3px 7px;}
    .wrap{padding-left:14px;padding-right:14px;}
    .avatar{width:40px;height:40px;border-radius:15px;}
    .hero{height:92px;}
  }
  /* 짧은 화면(갤럭시 A/S, 360x780 등): 5명이 한 화면에 들어오도록 한 단계 압축 */
  @media (max-width:480px) and (max-height:820px){
    .hero{height:66px;}
    .list{gap:7px;padding-top:7px;}
    .card{padding:6px 12px;}
    .avatar{width:40px;height:40px;border-radius:14px;}
    .card-name{font-size:19.5px;}
    .num{font-size:20px;}
    .more-btn{height:22px;padding:0 8px;}
    .actions{margin-top:4px;}
    .abtn{min-height:36px;font-size:14px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<!-- ================= 잠금 ================= -->
<div class="lock" id="lockScreen">
  <div class="lock-inner">
    <div class="lock-hero"><img src="./team_banner.jpg" alt="현대차 단독부지 5인 관리자 팀 일러스트"></div>
    <h1>단독부지 비상연락망</h1>
    <p class="lock-sub">현대엔지니어링 의왕연구소 · 5인 팀 전용</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <p class="lock-msg" id="lockMsg">4자리 PIN을 입력하세요</p>
    <div class="keypad" id="keypad">
      <button class="key" data-key="1" type="button">1</button>
      <button class="key" data-key="2" type="button">2</button>
      <button class="key" data-key="3" type="button">3</button>
      <button class="key" data-key="4" type="button">4</button>
      <button class="key" data-key="5" type="button">5</button>
      <button class="key" data-key="6" type="button">6</button>
      <button class="key" data-key="7" type="button">7</button>
      <button class="key" data-key="8" type="button">8</button>
      <button class="key" data-key="9" type="button">9</button>
      <button class="key ghost" data-key="clear" type="button">지우기</button>
      <button class="key" data-key="0" type="button">0</button>
      <button class="key ghost" data-key="back" type="button">⌫</button>
    </div>
    <p class="lock-foot">연락처는 이 화면의 PIN으로만 열립니다.<br>저장소에는 AES-256 암호문으로만 남습니다.</p>
  </div>
</div>

<!-- ================= 앱 ================= -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <div class="tb-title">
        <h1>단독부지 비상연락망</h1>
      </div>
      <div class="tb-actions">
        <button class="tbtn" id="editToggle" type="button">편집</button>
        <button class="tbtn lock" id="lockBtn" type="button" title="잠금" aria-label="잠금">🔒</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="hero"><img src="./team_banner.jpg" alt="현대차 단독부지 5인 관리자 팀 일러스트"></div>
    <div class="list" id="list"></div>

    <section class="panel" id="editPanel" hidden>
      <h2>연락처 관리</h2>
      <button class="wbtn primary" id="addBtn" type="button">＋ 연락처 추가</button>
      <div class="panel-row">
        <button class="wbtn" id="exportBtn" type="button">⬇ 암호화 백업</button>
        <button class="wbtn" id="importBtn" type="button">⬆ 백업 불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <h2 style="margin-top:6px;">PIN 변경</h2>
      <div class="pinrow">
        <input id="pinInput" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="새 PIN 4자리">
        <button class="wbtn" id="pinSave" type="button">저장</button>
      </div>
      <p class="hint">처음 PIN은 1234입니다. 바꾼 PIN과 고친 내용은 이 기기에만 새 PIN으로 다시 암호화해 저장됩니다.</p>
      <button class="wbtn" id="resetBtn" type="button">↺ 기본 연락처로 되돌리기</button>
    </section>

    <p class="foot">PIN으로 잠긴 연락망 · 오프라인에서도 열립니다<br>현대엔지니어링 의왕연구소 현대차 단독부지</p>
  </div>
</div>

<!-- ================= 편집 시트 ================= -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <h2 id="sheetTitle">연락처 수정</h2>
    <form id="editForm" autocomplete="off">
      <div class="photorow">
        <div class="photoprev" id="photoPrev">사진</div>
        <div class="photobtns">
          <button class="wbtn" id="photoPick" type="button">📷 사진 선택</button>
          <button class="wbtn" id="photoClear" type="button">삭제</button>
        </div>
      </div>
      <input type="file" id="photoFile" accept="image/*" hidden>
      <div class="field">
        <label for="f-name">이름</label>
        <input id="f-name" name="name" type="text" placeholder="예) 성명" required>
      </div>
      <div class="field">
        <label for="f-title">직책</label>
        <input id="f-title" name="title" type="text" placeholder="예) 책임 / 매니저">
      </div>
      <div class="field">
        <label for="f-duty">담당 (카드 뱃지)</label>
        <input id="f-duty" name="duty" type="text" placeholder="예) 소방·안전">

  function hasCrypto(){ return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey); }

  function deriveKey(pin, salt, iter){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function(bk){
        return crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"},
          bk, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
      });
  }
  function decryptPayload(p, pin){
    if(!hasCrypto()) return Promise.reject(new Error("nocrypto"));
    var iter = p.iter || ITER_FALLBACK;
    return deriveKey(pin, b64ToBytes(p.salt), iter).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(p.iv)}, key, b64ToBytes(p.cipher));
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }
  function encryptPayload(obj, pin){
    if(!hasCrypto()) return Promise.reject(new Error("nocrypto"));
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pin, salt, ITER_FALLBACK).then(function(key){
      return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key,
        new TextEncoder().encode(JSON.stringify(obj)));
    }).then(function(buf){
      return {
        v:2, alg:"AES-GCM", kdf:"PBKDF2-SHA256", iter:ITER_FALLBACK,
        salt:bytesToB64(salt), iv:bytesToB64(iv), cipher:bytesToB64(new Uint8Array(buf))
      };
    });
  }

  /* ---------- 사진 ---------- */
  function resizePhoto(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        try{
          var S = 240;
          var cv = document.createElement("canvas");
          cv.width = S; cv.height = S;
          var g = cv.getContext("2d");
          g.fillStyle = "#ffffff";
          g.fillRect(0, 0, S, S);
          var scale = Math.max(S / img.width, S / img.height);
          var w = img.width * scale, h = img.height * scale;
          g.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
          cb(cv.toDataURL("image/jpeg", 0.82));
        }catch(e){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = String(reader.result);
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function copyText(text){
    var done = function(){ toast(text + " 복사됨"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    }else{
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly","");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    if(ok) done(); else toast("복사가 차단되었습니다. 길게 눌러 복사하세요");
  }

  $("#importFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var text = String(reader.result);
      var parsed;
      try{ parsed = JSON.parse(text); }catch(err){ toast("JSON 형식이 올바르지 않습니다"); e.target.value = ""; return; }

      function done(arr){
        if(!arr || !arr.length){ toast("불러올 연락처가 없습니다"); e.target.value = ""; return; }
        if(!confirm("현재 연락처 " + contacts.length + "개를 불러온 " + arr.length + "개로 바꿀까요?")) { e.target.value = ""; return; }
        contacts = arr.map(normalize).filter(function(c){ return c.name; });
        persist().then(function(){ render(); toast("불러왔습니다 (" + contacts.length + "명)"); });
        e.target.value = "";

      if(parsed && parsed.cipher && parsed.salt && parsed.iv){
        decryptPayload(parsed, pinNow).then(function(data){
          done(data && Array.isArray(data.contacts) ? data.contacts : null);
        }).catch(function(){ toast("이 백업은 현재 PIN으로 열 수 없습니다"); e.target.value = ""; });
      }else if(Array.isArray(parsed)){
        if(confirm("평문 연락처 파일입니다. 불러오면 이 기기에서 암호화해 저장합니다. 계속할까요?")) done(parsed);

    openPanels = {};
    APP.hidden = true;
    LOCK.hidden = false;
    window.scrollTo(0, 0);
  }

  function fail(){
    setMsg("PIN이 맞지 않습니다. 다시 입력하세요.", "err");
    dots.classList.remove("shake");
    void dots.offsetWidth;
    dots.classList.add("shake");
    setTimeout(function(){ clearBuffer(); dots.classList.remove("shake"); }, 460);
  }

  function tryUnlock(pin){
    var local = readLocal();
    var sources = local ? [local, BASE] : [BASE];
    var i = 0;
    function next(){
      if(i >= sources.length) return Promise.resolve(false);
      var src = sources[i++];
      return decryptPayload(src, pin).then(function(data){
        if(data && Array.isArray(data.contacts)){
          contacts = data.contacts.map(normalize);
          pinNow = pin;
          saveSession();
          return true;
        }
        return next();
      }).catch(function(){ return next(); });
    }
    return next();
  }

  function pressKey(k){
    if(busy) return;
    if(k === "clear"){ clearBuffer(); return; }
    if(k === "back"){ buffer = buffer.slice(0, -1); paintDots(); return; }
    if(!/^\d$/.test(k)) return;
    if(buffer.length >= 4) return;
    buffer += k;
    paintDots();
    if(buffer.length < 4) return;

    if(!hasCrypto()){
      setMsg("HTTPS 주소에서만 열 수 있습니다. 주소를 확인해 주세요.", "warn");
      clearBuffer();
      return;
    }
    busy = true;
    dots.classList.add("busy");
    setMsg("확인 중…");
    tryUnlock(buffer).then(function(ok){
      busy = false;
      dots.classList.remove("busy");
      if(ok){ clearBuffer(); showApp(); }
      else { fail(); }
    }).catch(function(){
      busy = false;
      dots.classList.remove("busy");
      fail();
    });
  }

  $("#keypad").addEventListener("click", function(e){
    var btn = e.target.closest(".key");
    if(!btn) return;
    pressKey(btn.dataset.key);
  });

  document.addEventListener("keydown", function(e){
    if(LOCK.hidden) return;
    if(/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if(e.key === "Backspace") pressKey("back");
    else if(e.key === "Escape") pressKey("clear");
  });

  $("#lockBtn").addEventListener("click", lockNow);

  /* ---------- 시작 ---------- */
  var session = readSession();
  if(session){
    contacts = session.contacts.map(normalize);
    pinNow = session.pin || null;
    showApp();
  }else{
    APP.hidden = true;
    LOCK.hidden = false;
    setMsg("4자리 PIN을 입력하세요");
    if(!hasCrypto()){
      setMsg("HTTPS 주소에서만 열립니다. 주소를 확인해 주세요.", "warn");
    }
  }

  /* ---------- Service Worker (오프라인) ---------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){ /* 오프라인 캐시 미지원 */ });
    });
  }
})();
</script>
</body>
</html>
